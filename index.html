    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05020a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* زر الفتح الانيق */
        .show-btn {
            background: linear-gradient(135deg, #ff0055, #990033);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 42px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .show-btn:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 0 45px rgba(255, 0, 85, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.5);
        }
