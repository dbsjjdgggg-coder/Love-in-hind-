    <style>

        body {

            min-height: 100vh;
            display: flex;

        }
        .show-btn {
            background: linear-gradient(135deg, #e11d48, #be123c);

            border-radius: 50px;
            cursor: pointer;

            transition: all 0.3s ease;
            z-index: 10;
            letter-spacing: 1px;
        }
        .show-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(225, 29, 72, 0.7);
        }
        #canvas-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        canvas { display: block; }
