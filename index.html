<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ✨</title>
    <!-- استدعاء خط أجنبي كلاسيكي وجميل للعبارة -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .show-btn {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: white;
            border: none;
            padding: 18px 42px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(225, 29, 72, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            letter-spacing: 1px;
        }
        .show-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(225, 29, 72, 0.7);
        }
        #canvas-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <button id="mainBtn" class="show-btn" onclick="startDrawing()">Open Surprise ✨</button>

    <div id="canvas-container">
        <canvas id="myCanvas"></canvas>
    </div>

    <script>
        function startDrawing() {
            document.getElementById('mainBtn').style.display = 'none';
            const container = document.getElementById('canvas-container');
            container.style.display = 'block';

            const canvas = document.getElementById('myCanvas');
            const ctx = canvas.getContext('2d');

            const w = canvas.width = window.innerWidth;
            const h = canvas.height = window.innerHeight;
            const cx = w / 2;
            const cy = h / 2 - 30; // رفع القلب قليلاً لترك مساحة للنص تحت

            // تحديد مقياس الرسم
            const scaleFactor = Math.min(w, h) / 750;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            // معادلة القلب
            function heart(a, sc) {
                const x = 16 * Math.pow(Math.sin(a), 3) * sc * scaleFactor;
                const y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * sc * scaleFactor;
                return { x: x, y: y };
            }

            let count = 0;
            const totalStage1 = 10000;
            const totalStage2 = 3500;
            const totalPoints = totalStage1 + totalStage2;

            function draw() {
                // تقليل عدد النقاط في كل إطار من أجل جعل الرسم بطيئاً وهادئاً
                let batchSize = 25; 

                for (let b = 0; b < batchSize; b++) {
                    if (count >= totalPoints) break;

                    let a, sc, pos;
                    if (count < totalStage1) {
                        a = Math.random() * 2 * Math.PI;
                        sc = 0.5 + Math.random() * 15.0;
                        pos = heart(a, sc);
                    } else {
                        a = Math.random() * 2 * Math.PI;
                        sc = 16.0;
                        pos = heart(a, sc);
                    }

                    const ang = Math.atan2(-pos.y, pos.x) + (Math.random() * 1.0 - 0.5);
                    const len = (4 + Math.random() * 10) * scaleFactor;

                    const r = 255;
                    const g = Math.floor((0.25 + Math.random() * 0.35) * 255);
                    const bVal = Math.floor((0.65 + Math.random() * 0.25) * 255);

                    ctx.strokeStyle = `rgb(${r}, ${g}, ${bVal})`;
                    ctx.lineWidth = 0.7;

                    const startX = cx + pos.x;
                    const startY = cy + pos.y;
                    const endX = startX + len * Math.cos(ang);
                    const endY = startY - len * Math.sin(ang);

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();

                    count++;
                }

                if (count < totalPoints) {
                    requestAnimationFrame(draw);
                } else {
                    // بعد إتمام الرسم تظهر الجملة بخط راقي تحت القلب ببطء
                    showText();
                }
            }

            // ظهور النص الأنيق
            function showText() {
                let opacity = 0;
                function fadeInText() {
                    opacity += 0.015;
                    ctx.save();
                    // مسح خلفية النص القليلة لإعادة الرسم
                    ctx.fillStyle = `rgba(0, 0, 0, 0.05)`;
                    ctx.fillRect(0, cy + 180 * scaleFactor, w, 150);

                    ctx.font = `400 ${Math.max(28, Math.floor(42 * scaleFactor))}px 'Great Vibes', cursive`;
                    ctx.fillStyle = `rgba(255, 230, 240, ${opacity})`;
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = 'rgba(255, 50, 100, 0.8)';
                    
                    ctx.fillText("thanks to be in my life", cx, cy + 240 * scaleFactor);
                    ctx.restore();

                    if (opacity < 1) {
                        requestAnimationFrame(fadeInText);
                    }
                }
                fadeInText();
            }

            draw();
        }
    </script>
</body>
</html>
